<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clara Doce — Francisco Ramos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e0c0b'/><text x='32' y='43' text-anchor='middle' font-family='system-ui,sans-serif' font-size='30' font-weight='800' fill='%23ff5a7a'>FR</text></svg>">
  <style>
    :root { --bg: #0e0c0b; --fg: #f4eee6; --mut: #a19b92; --ac: #ff5a7a; --ac2: #ffb86b; --line: rgba(244,238,230,.09); --line2: rgba(244,238,230,.18); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--ac); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--ac); outline-offset: 4px; border-radius: 4px; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
    .back { display: inline-block; margin-top: 2rem; color: var(--mut); letter-spacing: .2em; font-size: .8rem; text-transform: uppercase; }
    .back:hover, .back:focus-visible { color: var(--ac); }
    header { padding: 5rem 0 3rem; }
    .label { color: var(--ac); font-size: .9rem; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(3.5rem, 12vw, 9rem); line-height: .9; font-weight: 900; letter-spacing: -.05em; }
    header p { color: var(--mut); font-size: clamp(1.1rem, 2vw, 1.4rem); margin-top: 1.2rem; max-width: 40ch; }
    header p b { color: var(--fg); font-weight: 600; }
    .site { display: inline-block; margin-top: 2rem; border: 1px solid var(--line2); padding: .9rem 2rem; border-radius: 999px; letter-spacing: .15em; transition: all .3s; }
    .site:hover, .site:focus-visible { background: var(--ac); border-color: var(--ac); color: var(--bg); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); grid-auto-flow: dense; gap: .8rem; padding-bottom: 6rem; }
    .gallery img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: .6rem; position: relative; box-shadow: 0 10px 30px -10px rgba(0,0,0,.8); transition: transform .4s cubic-bezier(.2,.7,.2,1); }
    .gallery img:hover { transform: scale(1.05) rotate(-1.5deg); box-shadow: 0 25px 50px -15px rgba(255,90,122,.45); z-index: 1; }
    @media (min-width: 700px) { .gallery img:nth-child(5n+1) { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; height: 100%; } }
    footer { padding: 2rem 0; color: var(--mut); border-top: 1px solid var(--line); font-size: .85rem; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
